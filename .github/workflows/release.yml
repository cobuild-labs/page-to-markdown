name: Release
# Publishing a release on GitHub (with a tag like v1.5.0) builds the extension
# zip and attaches it to that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to (for example v1.5.0)
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the tag matches the extension version
        run: test "${TAG#v}" = "$(node -p "require('./extension/manifest.json').version")"
      - name: Build
        run: bash scripts/build.sh
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber
