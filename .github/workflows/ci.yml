name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax, manifest and privacy checks
        run: node scripts/check.mjs
      - name: Version matches package.json
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = "$(node -p "require('./package.json').version")"
